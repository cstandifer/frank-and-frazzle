<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the sketch use the whole screen, around any notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Frank &amp; Frazzle</title>

    <!-- so "Add to Home Screen" opens it like an app, with no browser bars -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Frank &amp; Frazzle">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1d2b1f">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="icons/icon-192.png">

    <link rel="stylesheet" type="text/css" href="style.css">

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
  </head>

  <body>
    <!-- only shows up on a phone held upright (see style.css) -->
    <div id="rotate-hint">
      <div class="phone">📱</div>
      <div>Turn your phone sideways to visit Frank &amp; Frazzle</div>
    </div>

    <!-- round buttons in the top-right corner (sketch.js shows the ones that
         make sense on this device) -->
    <div id="corner-buttons">
      <!-- zoom in to fill the screen, or back out to see the whole scene -->
      <button id="zoom-btn" class="corner-btn" aria-label="Zoom in" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="M15.5 15.5L21 21M8 10.5h5" />
          <path class="plus-bar" d="M10.5 8v5" />
        </svg>
      </button>

      <!-- only where the browser allows full screen (not on iPhone) -->
      <button id="fullscreen-btn" class="corner-btn" aria-label="Full screen" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
        </svg>
      </button>
    </div>

    <!-- on iPhone, the only way to hide Safari's bars is Add to Home Screen -->
    <div id="home-screen-tip" hidden>
      <span>For full screen: tap <b>Share</b>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 15V3M8 7l4-4 4 4M6 11H5v10h14V11h-1" />
        </svg>
        then <b>Add to Home Screen</b></span>
      <button id="tip-close" aria-label="Close tip">✕</button>
    </div>

    <script src="sketch.js"></script>
  </body>
</html>
